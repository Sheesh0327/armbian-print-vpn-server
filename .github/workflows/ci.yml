name: Security & Quality CI

on:
  push:
    branches: [ main, security-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest flask werkzeug cryptography gunicorn

      - name: Run shellcheck
        run: |
          shellcheck setup.sh
          shellcheck scripts/backup-server.sh

      - name: Run flake8 linter
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce complexity and basic linting rules (ignoring long lines in embedded templates)
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=160 --statistics --ignore=E501,W503

      - name: Run test suite
        run: |
          pytest -v tests/
